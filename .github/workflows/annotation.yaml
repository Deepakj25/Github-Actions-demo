name: Annotation workflow
on:
    workflow_dispatch:
jobs:
    annotation:
        runs-on: ubuntu-latest
        steps:
        - name: Workflow commands demo
          run: |
            echo "::notice::Build started"
            echo "::warning::This is a test warning"
            echo "::error::This is a test error"

        - name: Group logs
          run: |
            echo "::group::Build details"
            echo "Line 1"
            echo "Line 2"
            echo "::endgroup::"

        - name: Create summary
          run: |
            echo "# Workflow Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "## Status" >> "$GITHUB_STEP_SUMMARY"
            echo "- Build: Passed" >> "$GITHUB_STEP_SUMMARY"
            echo "- Environment: Dev" >> "$GITHUB_STEP_SUMMARY"
