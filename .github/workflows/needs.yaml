name: Multiple Jobs Workflow

on:
  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-latest

    steps:
      - name: Print Job 1
        run: echo "Job 1 is running"


  job2:
    runs-on: ubuntu-latest
    needs: job1

    steps:
      - name: Print Job 2
        run: echo "Job 2 is running"


  job3:
    runs-on: ubuntu-latest
    needs: 
      - job1
      - job2

    steps:
      - name: Print Job 3
        run: echo "Job 3 is running"