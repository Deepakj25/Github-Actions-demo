name: Dynamic Matrix Example

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest

    outputs:
      apps: ${{ steps.generate.outputs.apps }}

    steps:
      - name: Generate matrix
        id: generate
        run: |
          apps='["frontend","backend","worker"]'
          echo "apps=$apps" >> "$GITHUB_OUTPUT"


  test:
    needs: prepare
    runs-on: ubuntu-latest

    strategy:
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}

    steps:
      - name: Test application
        run: |
          echo "Testing ${{ matrix.app }}"