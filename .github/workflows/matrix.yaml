name: Matrix Lab

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

        exclude:
          - os: windows-latest
            node: 22
            
        include:
          - os: macos-latest
            node: 22
            environment: test

    runs-on: ${{ matrix.os }}

    steps:
      - name: Show Matrix Values
        run: |
          echo "Environment: ${{ matrix.environment }}"
          echo "OS: ${{ matrix.os }}"
          echo "Node: ${{ matrix.node }}"
