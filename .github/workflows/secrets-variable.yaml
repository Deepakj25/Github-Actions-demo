name: Environment Secrets and Variables

on:
  workflow_dispatch:

jobs:

  dev:
    runs-on: ubuntu-latest

    # This job gets secrets and variables from DEV environment
    environment: dev

    steps:
      - name: Print Dev Values
        run: |
          echo "Environment Name: ${{ vars.ENV_NAME }}"
          echo "Secret: ${{ secrets.ENV_SECRET_KEY }}"


  qa:
    runs-on: ubuntu-latest

    # This job gets secrets and variables from QA environment
    environment: qa

    steps:
      - name: Print QA Values
        run: |
          echo "Environment Name: ${{ vars.ENV_NAME }}"
          echo "Secret: ${{ secrets.ENV_SECRET_KEY }}"