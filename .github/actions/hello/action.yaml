name: Hello Composite Action
description: A simple composite action

inputs:
  enviornment:
    description: 'Environment name'

outputs:
  greeting:
    description: The generated greeting
    value: ${{ steps.generate.outputs.greeting }}

runs:
  using: composite
  steps:    
    - name: Step 1
      run: echo "Hello from composite action step 1"
      shell: bash
    
    - name: Print inputs variable
      run: |
        echo "Environment inside composite action: ${{ inputs.enviornment }}"
      shell: bash

    - name: Print env variable
      run: |
        echo "Workflow  env variable inside composite action: $WORKFLOW_VAR"
      shell: bash

    - name: Generate greeting
      id: generate
      run: echo "greeting=Hello ${{ inputs.name }}" >> "$GITHUB_OUTPUT"
      shell: bash

    - name: if condition
      if: ${{ inputs.enviornment == 'Dev' }}
      run: echo "Hello from Dev environment"
      shell: bash